<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>تقرير مستودع الطوبة - Al-Tuba Oil Depot</title>
<style>
  :root{ --green:#25D366; --green-dark:#128C7E; }
  *{box-sizing:border-box; font-family:"Segoe UI",Tahoma,Arial,sans-serif;}
  body{
    margin:0; min-height:100vh; padding:16px;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    display:flex; justify-content:center; align-items:flex-start;
  }
  .card{
    width:100%; max-width:680px; background:#fff; border-radius:18px;
    box-shadow:0 18px 45px rgba(0,0,0,.4); overflow:hidden;
  }
  .head{
    background:linear-gradient(135deg,#0b3d2e,#128C7E 50%,#25D366);
    color:#fff; padding:18px 20px; text-align:center; position:relative; overflow:hidden;
  }
  .head::before{
    content:''; position:absolute; width:180px; height:180px;
    background:rgba(255,255,255,.08); border-radius:50%; top:-80px; left:-50px;
  }
  .head::after{
    content:''; position:absolute; width:120px; height:120px;
    background:rgba(255,255,255,.06); border-radius:50%; bottom:-70px; right:-30px;
  }
  .head h1{margin:0; font-size:19px; letter-spacing:.3px; position:relative; z-index:1;}
  .head p{margin:4px 0 0; font-size:12px; opacity:.9; direction:ltr; position:relative; z-index:1;}

  .body{padding:16px 18px 20px;}

  .clockbox{
    display:grid; grid-template-columns:1fr 1fr auto; gap:8px;
    align-items:end; margin-bottom:14px;
  }
  .clock-item{display:flex; flex-direction:column; gap:4px;}
  .clock-lbl{font-size:11px; font-weight:800; color:#64748b; letter-spacing:.6px;}
  .clock-item input{
    width:100%; padding:8px 8px; border:1.5px solid #d6dde3; border-radius:10px;
    font-size:14px; background:#f8fafc; text-align:center; color:#0f172a;
  }
  .btn-now{
    padding:9px 12px; border:none; border-radius:10px; cursor:pointer;
    background:#e2e8f0; color:#334155; font-size:12px; font-weight:800;
  }
  .btn-now:active{transform:scale(.95);}

  .grid{
    display:grid; grid-template-columns:60px 120px 50px 1fr 14px 1fr 1fr 1fr;
    gap:6px; align-items:center;
  }
  .head-row{margin-bottom:6px;}
  .head-row span{
    font-size:10.5px; font-weight:800; color:#94a3b8;
    text-align:center; letter-spacing:.2px;
  }
  .head-row span:first-child{text-align:right;}

  .row{margin-bottom:8px;}
  .row label{font-weight:800; font-size:13.5px; color:#1e293b; direction:ltr; text-align:left;}
  .slash{text-align:center; color:#cbd5e1; font-weight:800;}

  /* حقول T.P. - تستوعب حرفين */
  .tp-group{display:flex; gap:4px; justify-content:center;}
  .tp-input{
    width:36px; height:26px; padding:0; border:1.5px solid #d6dde3; border-radius:6px;
    font-size:14px; font-weight:800; text-align:center; text-transform:uppercase;
    background:#f8fafc; color:#0f172a; outline:none; letter-spacing:1px;
  }
  .tp-input:focus{border-color:var(--green); box-shadow:0 0 0 3px rgba(37,211,102,.18);}

  /* أزرار الأسهم */
  .arrow-group{display:flex; gap:4px; justify-content:center;}
  .arrow-btn{
    width:28px; height:28px; border:none; border-radius:6px; background:#f1f5f9;
    color:#94a3b8; font-size:16px; font-weight:900; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:.15s;
    padding:0; line-height:1;
  }
  .arrow-btn.up.active{background:#25D366; color:#fff; box-shadow:0 2px 8px rgba(37,211,102,.4);}
  .arrow-btn.down.active{background:#ef4444; color:#fff; box-shadow:0 2px 8px rgba(239,68,68,.4);}
  .arrow-btn:active{transform:scale(.92);}

  input[type=number]{
    width:100%; padding:10px 6px; border:1.5px solid #d6dde3; border-radius:10px;
    font-size:15px; font-weight:700; text-align:center; background:#f8fafc;
    color:#0f172a; transition:.15s;
  }
  input[type=number]:focus{
    outline:none; border-color:var(--green); background:#fff;
    box-shadow:0 0 0 3px rgba(37,211,102,.18);
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  input[type=number]{-moz-appearance:textfield;}

  .total-row{
    background:#eef7f1; border:1.5px solid #cdead9; border-radius:12px;
    padding:10px; margin-top:10px;
  }
  .total-row label{color:#0f5132; font-weight:800;}
  .total-row span{text-align:center; font-weight:900; font-size:16px;}
  #totalX{color:#0f5132;}
  #totalV{color:#0369a1;}
  #totalF{color:#b45309;}
  #totalR{color:#7c3aed;}

  .canvas-wrap{
    margin:16px 0 12px; border-radius:14px; overflow:hidden;
    box-shadow:0 12px 35px rgba(15,32,39,.18); background:#fff; line-height:0;
  }
  .canvas-wrap canvas{display:block; width:100%; height:auto;}

  .phone-row{
    display:flex; align-items:center; gap:8px; margin-bottom:12px;
    border:1.5px solid #d6dde3; border-radius:12px; padding:4px 12px; background:#f8fafc;
  }
  .phone-row span{font-size:18px;}
  .phone-row input{
    flex:1; border:none; background:transparent; padding:10px 0;
    font-size:14px; outline:none; direction:ltr; font-weight:600;
  }

  .btn{
    display:flex; align-items:center; justify-content:center; gap:9px;
    width:100%; padding:15px; border:none; border-radius:13px;
    font-size:16px; font-weight:800; cursor:pointer; transition:.18s;
    font-family:inherit;
  }
  .btn-wa{
    background:linear-gradient(135deg,#25D366,#128C7E); color:#fff;
    box-shadow:0 10px 24px rgba(37,211,102,.4);
  }
  .btn-wa:active{transform:scale(.98);}
  .btn-row{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:9px;}
  .btn-sec{background:#eef2f6; color:#334155; font-size:14px; padding:13px;}
  .btn-sec:active{background:#e2e8f0;}

  .note{font-size:11.5px; color:#94a3b8; text-align:center; margin-top:12px; line-height:1.7;}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
    background:#0f172a; color:#fff; padding:11px 22px; border-radius:30px;
    font-size:13px; opacity:0; pointer-events:none; transition:.3s; z-index:99;
    box-shadow:0 10px 30px rgba(0,0,0,.3); font-weight:600;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* شاشات صغيرة */
  @media (max-width:500px){
    body{padding:10px;}
    .body{padding:14px 10px 18px;}
    .grid{grid-template-columns:44px 90px 40px 1fr 10px 1fr 1fr 1fr; gap:3px;}
    .tp-input{width:26px; height:20px; font-size:11px; border-radius:4px; letter-spacing:0;}
    .arrow-btn{width:22px; height:22px; font-size:13px; border-radius:4px;}
    .row label{font-size:11.5px;}
    .head-row span{font-size:9px; letter-spacing:0;}
    input[type=number]{padding:7px 2px; font-size:12px;}
    .total-row{padding:8px 6px;}
    .total-row span{font-size:13px;}
    .total-row label{font-size:12px;}
  }
</style>
</head>
<body>

<div class="card">
  <div class="head">
    <h1>تقرير الإرسال — مستودع الطوبة</h1>
    <p>Al-Tuba Oil Depot</p>
  </div>

  <div class="body">

      <div class="arrow-group">
        <button class="arrow-btn up" data-row="zub2" data-dir="up">▲</button>

    <!-- المجموع -->
    <div class="grid total-row">
      <label>total</label>
      <span></span>

      </svg>

<div class="toast" id="toast"></div>

<script>
/* ============ العناصر والثوابت ============ */
const $ = id => document.getElementById(id);

const FIELDS = [
  { x: 'tx',  v: 'tv',  f: 'tf',  r: 'tr'  },
  { x: 'px',  v: 'pv',  f: 'pf',  r: 'pr'  },
  { x: 'z1x', v: 'z1v', f: 'z1f', r: 'z1r' },
  { x: 'z2x', v: 'z2v', f: 'z2f', r: 'z2r' }
];

let autoTime = true;

const pad = n => String(n).padStart(2, '0');
function num(id){
  const el = $(id);
  if (!el || el.value === '') return 0;
  const n = parseFloat(el.value);
  return isNaN(n) ? 0 : n;
}
function fmt(n){
  const r = Math.round(n * 100) / 100;
  return r.toLocaleString('en-US', { maximumFractionDigits: 2 });
}
function totals(){
  let s = 0, d = 0, f = 0, r = 0;
  FIELDS.forEach(o => {
    s += num(o.x);
    d += num(o.v);
    f += num(o.f);
    r += num(o.r);
  });
  return { s, d, f, r };
}
function getTimeStr(){ return $('timeInput').value || '--:--'; }
function getDateStr(){
  const v = $('dateInput').value;
  return v ? v.split('-').reverse().join('/') : '--/--/----';
}

/* ============ أدوات مساعدة للرسم ============ */
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function roundRectTop(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h);
  ctx.lineTo(x, y + h);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
function roundRectBottom(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + w, y);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y);
  ctx.closePath();
}
function drawInfoCard(ctx, x, y, w, h, label, value){
  ctx.save();
  ctx.shadowColor = 'rgba(15,32,39,0.08)';
  ctx.shadowBlur = 18;
  ctx.shadowOffsetY = 6;
  ctx.fillStyle = '#ffffff';
  roundRect(ctx, x, y, w, h, 14);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.beginPath();
  roundRect(ctx, x, y + 16, 5, h - 32, 3);
  ctx.fillStyle = '#25D366';
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = '#94a3b8';
  ctx.font = '800 12px "Segoe UI", Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(label, x + 26, y + 34);

  ctx.fillStyle = '#0f172a';
  ctx.font = 'bold 26px "Segoe UI", Arial, sans-serif';
  ctx.fillText(value, x + 26, y + 72);
}

/* ============ دوال T.P. والأسهم ============ */
function getTP(row) {
  return [0,1,2].map(i => {
    const el = document.getElementById(`tp-${row}-${i}`);
    return el ? el.value.toUpperCase() : '';
  });
}
function isArrowActive(row, dir) {
  const btn = document.querySelector(`.arrow-btn.${dir}[data-row="${row}"]`);
  return btn && btn.classList.contains('active');
}
function drawLetterBox(ctx, x, y, w, h, letter) {
  ctx.save();
  ctx.fillStyle = '#f1f5f9';
  ctx.strokeStyle = '#cbd5e1';
  ctx.lineWidth = 1;
  roundRect(ctx, x - w/2, y - h/2, w, h, 4);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#0f172a';
  ctx.font = 'bold 15px "Segoe UI", Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(letter || '', x, y + 1);
  ctx.restore();
}

/* ============ رسم التقرير ============ */
function drawReport(){
  const W = 900, H = 1130;
  const scale = 2;
  const canvas = $('reportCanvas');
  canvas.width = W * scale;
  canvas.height = H * scale;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(scale, 0, 0, scale, 0, 0);

  // الخلفية
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#ffffff');
  bg.addColorStop(1, '#f0fdf4');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  /* ===== الهيدر ===== */
  const headerH = 200;
  const hg = ctx.createLinearGradient(0, 0, W, headerH);
  hg.addColorStop(0, '#0b3d2e');
  hg.addColorStop(0.5, '#128C7E');
  hg.addColorStop(1, '#25D366');
  ctx.fillStyle = hg;
  ctx.fillRect(0, 0, W, headerH);

  // دوائر تزيينية
  ctx.save();
  ctx.globalAlpha = 0.08;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(W - 60, 30, 170, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(40, headerH - 10, 110, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // شعار دائري
  ctx.save();
  ctx.beginPath();
  ctx.arc(W/2, 62, 34, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 1.8;
  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 32px "Segoe UI", Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('T', W/2, 64);
  ctx.restore();

  // العنوان الرئيسي فقط
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 46px "Segoe UI", Arial, sans-serif';
  ctx.fillText('Al-Tuba Oil Depot', W/2, 152);

  /* ===== بطاقات الوقت والتاريخ ===== */
  const infoY = 238;
  const cardW = 380;
  const cardH = 100;
  drawInfoCard(ctx, 70, infoY, cardW, cardH, 'TIME', getTimeStr());
  drawInfoCard(ctx, W - 70 - cardW, infoY, cardW, cardH, 'DATE', getDateStr());

  /* ===== الجدول ===== */
  const tblX = 70;
  const tblW = W - 140;
  const tblY = 400;
  const headH = 64;
  const rowH = 82;
  const footH = 96;
  const tblH = headH + rowH * 4 + footH;

  // ظل وبطاقة
  ctx.save();
  ctx.shadowColor = 'rgba(15,32,39,0.12)';
  ctx.shadowBlur = 34;
  ctx.shadowOffsetY = 12;
  ctx.fillStyle = '#ffffff';
  roundRect(ctx, tblX, tblY, tblW, tblH, 16);
  ctx.fill();
  ctx.restore();

  // رأس الجدول
  ctx.save();
  ctx.beginPath();
  roundRectTop(ctx, tblX, tblY, tblW, headH, 16);
  ctx.clip();
  const hg2 = ctx.createLinearGradient(0, tblY, 0, tblY + headH);
  hg2.addColorStop(0, '#0f5132');
  hg2.addColorStop(1, '#128C7E');
  ctx.fillStyle = hg2;
  ctx.fillRect(tblX, tblY, tblW, headH);
  ctx.restore();

  /* مواقع الأعمدة */
  const colItem    = tblX + 30;
  const colTP      = tblX + tblW * 0.18;
  const colArrows  = tblX + tblW * 0.32;
  const colAvail   = tblX + tblW * 0.46;
  const colFree    = tblX + tblW * 0.60;
  const colFlow    = tblX + tblW * 0.74;
  const colReceive = tblX + tblW * 0.89;

  ctx.fillStyle = '#ffffff';
  ctx.font = '800 15px "Segoe UI", Arial, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillText('ITEM', colItem, tblY + headH/2 + 1);
  ctx.textAlign = 'center';
  ctx.fillText('T.P.', colTP, tblY + headH/2 + 1);
  ctx.fillText('AVAIL',   colAvail,   tblY + headH/2 + 1);
  ctx.fillText('FREE',    colFree,    tblY + headH/2 + 1);
  ctx.fillText('FLOW',    colFlow,    tblY + headH/2 + 1);
  ctx.fillText('RECEIVE', colReceive, tblY + headH/2 + 1);

  // بيانات الصفوف
  const items = [
    { name: 'Tuba',  avail: num('tx'),  free: num('tv'),  flow: num('tf'),  receive: num('tr'),  rowKey: 'tuba' },
    { name: 'PS.1',  avail: num('px'),  free: num('pv'),  flow: num('pf'),  receive: num('pr'),  rowKey: 'ps1' },
    { name: 'zub.1', avail: num('z1x'), free: num('z1v'), flow: num('z1f'), receive: num('z1r'), rowKey: 'zub1' },
    { name: 'zub.2', avail: num('z2x'), free: num('z2v'), flow: num('z2f'), receive: num('z2r'), rowKey: 'zub2' }
  ];

  items.forEach((item, i) => {
    const ry = tblY + headH + i * rowH;

    ctx.fillStyle = i % 2 === 0 ? '#f8fafc' : '#ffffff';
    ctx.fillRect(tblX, ry, tblW, rowH);

    ctx.fillStyle = '#25D366';
    ctx.fillRect(tblX, ry, 5, rowH);

    if (i > 0){
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(tblX + 24, ry);
      ctx.lineTo(tblX + tblW - 24, ry);
      ctx.stroke();
    }

    // اسم العنصر
    ctx.fillStyle = '#0f172a';
    ctx.font = 'bold 20px "Segoe UI", Arial, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(item.name, colItem, ry + rowH/2);

    // T.P. letters (حرفان لكل مربع)
    const letters = getTP(item.rowKey);
    const tpY = ry + rowH/2;
    const boxW = 38, boxH = 22;
    const tpSpacing = 46;
    for (let j = 0; j < 3; j++) {
      const lx = colTP - tpSpacing + j * tpSpacing;
      drawLetterBox(ctx, lx, tpY, boxW, boxH, letters[j]);
    }

    // Arrows
    const upActive = isArrowActive(item.rowKey, 'up');
    const downActive = isArrowActive(item.rowKey, 'down');
    ctx.font = 'bold 18px "Segoe UI", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = upActive ? '#25D366' : '#cbd5e1';
    ctx.fillText('▲', colArrows - 12, tpY);
    ctx.fillStyle = downActive ? '#ef4444' : '#cbd5e1';
    ctx.fillText('▼', colArrows + 12, tpY);

    // AVAIL
    ctx.textAlign = 'center';
    ctx.fillStyle = '#0f5132';
    ctx.font = 'bold 24px "Segoe UI", Arial, sans-serif';
    ctx.fillText(fmt(item.avail), colAvail, ry + rowH/2);

    // FREE
    ctx.fillStyle = '#0369a1';
    ctx.fillText(fmt(item.free), colFree, ry + rowH/2);

    // FLOW
    ctx.fillStyle = '#b45309';
    ctx.fillText(fmt(item.flow), colFlow, ry + rowH/2);

    // RECEIVE
    ctx.fillStyle = '#7c3aed';
    ctx.fillText(fmt(item.receive), colReceive, ry + rowH/2);
  });

  /* ===== صف المجموع ===== */
  const totY = tblY + headH + 4 * rowH;
  ctx.save();
  ctx.beginPath();
  roundRectBottom(ctx, tblX, totY, tblW, footH, 16);
  ctx.clip();
  const tg = ctx.createLinearGradient(0, totY, 0, totY + footH);
  tg.addColorStop(0, '#ecfdf5');
  tg.addColorStop(1, '#d1fae5');
  ctx.fillStyle = tg;
  ctx.fillRect(tblX, totY, tblW, footH);
  ctx.restore();

  ctx.strokeStyle = '#a7f3d0';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(tblX, totY);
  ctx.lineTo(tblX + tblW, totY);
  ctx.stroke();

  const { s, d, f, r } = totals();

  ctx.fillStyle = '#065f46';
  ctx.font = '900 22px "Segoe UI", Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('TOTAL', colItem, totY + footH/2);

  // قيم المجموع
  ctx.textAlign = 'center';
  ctx.font = '900 28px "Segoe UI", Arial, sans-serif';
  ctx.fillText(fmt(s), colAvail,   totY + footH/2);
  ctx.fillText(fmt(d), colFree,    totY + footH/2);
  ctx.fillText(fmt(f), colFlow,    totY + footH/2);
  ctx.fillText(fmt(r), colReceive, totY + footH/2);

  /* ===== الفوتر ===== */
  const ftY = totY + footH + 55;

  // خط فاصل
  ctx.strokeStyle = '#cbd5e1';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(tblX + 140, ftY);
  ctx.lineTo(tblX + tblW - 140, ftY);
  ctx.stroke();

  // Issued by
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#334155';
  ctx.font = 'italic 700 18px "Segoe UI", Arial, sans-serif';
  ctx.fillText('Issued by the "Al-Tuba" Oil Depot', W/2, ftY + 42);

  /* ===== شعار Programming by Osama Abdul-Abbas ===== */
  const badgeW = 720;
  const badgeH = 56;
  const badgeX = (W - badgeW) / 2;
  const badgeY = ftY + 68;

  // ظل الشعار
  ctx.save();
  ctx.shadowColor = 'rgba(180,83,9,0.35)';
  ctx.shadowBlur = 20;
  ctx.shadowOffsetY = 6;

  // خلفية ذهبية متدرجة
  const badgeGrad = ctx.createLinearGradient(badgeX, badgeY, badgeX + badgeW, badgeY + badgeH);
  badgeGrad.addColorStop(0, '#b45309');
  badgeGrad.addColorStop(0.5, '#f59e0b');
  badgeGrad.addColorStop(1, '#fbbf24');
  ctx.fillStyle = badgeGrad;
  roundRect(ctx, badgeX, badgeY, badgeW, badgeH, badgeH / 2);
  ctx.fill();
  ctx.restore();

  // حدود داخلية مضيئة
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 1.2;
  roundRect(ctx, badgeX + 3, badgeY + 3, badgeW - 6, badgeH - 6, (badgeH - 6) / 2);
  ctx.stroke();
  ctx.restore();

  // زخرفة نجمية على الجانبين
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.font = 'bold 16px "Segoe UI", Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('★', badgeX + 24, badgeY + badgeH/2 + 1);
  ctx.fillText('★', badgeX + badgeW - 24, badgeY + badgeH/2 + 1);

  // النص الجديد
  ctx.fillStyle = '#ffffff';
  ctx.font = '900 18px "Segoe UI", Tahoma, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(120,53,15,0.6)';
  ctx.shadowBlur = 4;
  ctx.shadowOffsetY = 1;
  ctx.fillText('Programming by Osama Abdul-Abbas Supervised by Abdullah Abdul-Razzaq', W/2, badgeY + badgeH/2 + 2);
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;

  /* ===== سطر التوليد ===== */
  ctx.fillStyle = '#94a3b8';
  ctx.font = '500 12px "Segoe UI", Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  const stamp = new Date().toLocaleString('en-GB');
  ctx.fillText('Generated automatically  •  ' + stamp, W/2, badgeY + badgeH + 30);
}

/* ============ تحديث الواجهة ============ */
let drawTimer;
function scheduleDraw(){
  clearTimeout(drawTimer);
  drawTimer = setTimeout(() => {
    updateTotals();
    drawReport();
  }, 80);
}
function updateTotals(){
  const { s, d, f, r } = totals();
  $('totalX').textContent = fmt(s);
  $('totalV').textContent = fmt(d);
  $('totalF').textContent = fmt(f);
  $('totalR').textContent = fmt(r);
}
document.querySelectorAll('input[type=number]').forEach(el => {
  el.addEventListener('input', scheduleDraw);
});

/* ============ T.P. inputs & arrows ============ */
document.querySelectorAll('.tp-input').forEach(el => {
  el.addEventListener('input', scheduleDraw);
});
document.querySelectorAll('.arrow-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    const row = this.dataset.row;
    const dir = this.dataset.dir;
    // إلغاء تنشيط السهم الآخر في نفس الصف
    document.querySelectorAll(`.arrow-btn[data-row="${row}"]`).forEach(b => {
      if (b !== this) b.classList.remove('active');
    });
    this.classList.toggle('active');
    scheduleDraw();
  });
});

/* ============ الوقت والتاريخ ============ */
function tick(){
  if (!autoTime) return;
  const d = new Date();
  $('timeInput').value = pad(d.getHours()) + ':' + pad(d.getMinutes());
  $('dateInput').value = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  scheduleDraw();
}
$('timeInput').addEventListener('input', () => { autoTime = false; scheduleDraw(); });
$('dateInput').addEventListener('input', () => { autoTime = false; scheduleDraw(); });
$('btnNow').addEventListener('click', () => {
  autoTime = true; tick(); toast('تم إرجاع التحديث التلقائي ✓');
});

/* ============ توليد ملف الصورة ============ */
function canvasToFile(){
  return new Promise(resolve => {
    const canvas = $('reportCanvas');
    canvas.toBlob(blob => {
      const file = new File([blob], 'al-tuba-report.png', { type: 'image/png' });
      resolve({ blob, file });
    }, 'image/png');
  });
}

/* ============ إرسال واتساب ============ */
async function sendWhatsApp(){
  if (autoTime) tick();
  drawReport();

  const { blob, file } = await canvasToFile();
  const phone = $('phone').value.replace(/\D/g, '');

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file] });
      toast('تم إرسال الصورة ✓');
      return;
    } catch (err) {
      if (err.name === 'AbortError') return;
    }
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'al-tuba-report-' + Date.now() + '.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1200);

  toast('تم تنزيل الصورة — أرفقها في محادثة واتساب');

  setTimeout(() => {
    window.open('https://wa.me/' + phone, '_blank');
  }, 700);
}
$('btnSend').addEventListener('click', sendWhatsApp);

/* ============ تنزيل الصورة ============ */
$('btnDownload').addEventListener('click', async () => {
  drawReport();
  const { blob } = await canvasToFile();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'al-tuba-report-' + Date.now() + '.png';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('تم تنزيل الصورة ✓');
});

/* ============ مسح الكل ============ */
$('btnClear').addEventListener('click', () => {
  document.querySelectorAll('input[type=number]').forEach(el => el.value = '');
  document.querySelectorAll('.tp-input').forEach(el => el.value = '');
  document.querySelectorAll('.arrow-btn').forEach(btn => btn.classList.remove('active'));
  autoTime = true;
  tick();
  toast('تم مسح البيانات');
});

/* ============ إشعار ============ */
let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ============ التشغيل ============ */
tick();
setInterval(tick, 1000);
updateTotals();
drawReport();
</script>
